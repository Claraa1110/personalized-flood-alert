[project]
name = "personalized-flood-alert"
version = "0.1.0"
description = "個人化淹水預警系統 — FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "feedparser>=6.0.12",
    "geoalchemy2>=0.19.0",
    "geopandas>=1.1.3",
    "greenlet>=3.5.0",
    "httpx>=0.28.1",
    "openai>=2.36.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.49",
    "supabase>=2.15.0",
    "uvicorn[standard]>=0.46.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
# Every test module here is async; opting in globally avoids decorating each one.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::RuntimeWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/supabase_client.py"]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit (security)
    "ASYNC", # async pitfalls, incl. blocking calls in coroutines
]
ignore = [
    "E501",  # line length is handled by the formatter
    "S101",  # assert is expected in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["S", "E402"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
